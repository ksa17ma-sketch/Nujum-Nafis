function home(){A.innerHTML=`<div class="hero"><div>${LOGO(120)}</div><h1>نجوم نافس</h1><div>مستواك: <b>${LV[Math.min(3,Math.floor(tot()/8))]}</b> • ⭐ ${tot()} / 30</div><div class="bar" style="max-width:300px;margin:6px auto"><i style="width:${tot()/30*100}%"></i></div><div style="color:var(--mut)">لعبة تدريب على رياضيات الصف الثالث • 10 محاكيات • 109 أسئلة<br>👩‍🏫 معلمة المادة: مرام الحسيني<br>اجمع النجوم: ⭐ 50٪ • ⭐⭐ 80٪ (شهادة) • ⭐⭐⭐ 95٪</div></div>
